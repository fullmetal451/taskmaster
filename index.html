<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster 任務管理系統 (雲端同步版)</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Phosphor Icons (圖示庫) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- 載入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel (讓瀏覽器能直接讀取 React 語法) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <!-- 注意：為了使用模組化的雲端資料庫，這裡加入了 data-type="module" -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const { useState, useEffect, useMemo, useRef } = React;

    // --- 雲端資料庫初始化 ---
    let db = null;
    let auth = null;
    let appId = 'taskmaster-app';

const firebaseConfig = {
  apiKey: "AIzaSyDZF10ZVhn-O6GlC5pLo2pK7TX72kmlUsQ",
  authDomain: "taskmaster-db-264b9.firebaseapp.com",
  projectId: "taskmaster-db-264b9",
  storageBucket: "taskmaster-db-264b9.firebasestorage.app",
  messagingSenderId: "399271801562",
  appId: "1:399271801562:web:2762926f1656f18768ebe3",
  measurementId: "G-BF6PWRB8M8"
};

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  // 這裡可以自訂一個專屬的 App ID (英文數字即可)
  appId = 'my-taskmaster-v1'; 
} catch (error) {
  console.error("雲端資料庫初始化失敗:", error);
}

    // --- 圖示元件替代方案 (使用 Phosphor Icons) ---
    const LayoutDashboard = ({size=24, className=''}) => <i className={`ph ph-squares-four ${className}`} style={{fontSize: size}}></i>;
    const FolderKanban = ({size=24, className=''}) => <i className={`ph ph-kanban ${className}`} style={{fontSize: size}}></i>;
    const Users = ({size=24, className=''}) => <i className={`ph ph-users ${className}`} style={{fontSize: size}}></i>;
    const CheckSquare = ({size=24, className=''}) => <i className={`ph-fill ph-check-square ${className}`} style={{fontSize: size}}></i>;
    const History = ({size=24, className=''}) => <i className={`ph ph-clock-counter-clockwise ${className}`} style={{fontSize: size}}></i>;
    const Download = ({size=24, className=''}) => <i className={`ph ph-download-simple ${className}`} style={{fontSize: size}}></i>;
    const Upload = ({size=24, className=''}) => <i className={`ph ph-upload-simple ${className}`} style={{fontSize: size}}></i>;
    const Undo2 = ({size=24, className=''}) => <i className={`ph ph-arrow-u-up-left ${className}`} style={{fontSize: size}}></i>;
    const Plus = ({size=24, className=''}) => <i className={`ph ph-plus ${className}`} style={{fontSize: size}}></i>;
    const Trash2 = ({size=24, className=''}) => <i className={`ph ph-trash ${className}`} style={{fontSize: size}}></i>;
    const Filter = ({size=24, className=''}) => <i className={`ph ph-funnel ${className}`} style={{fontSize: size}}></i>;
    const AlertCircle = ({size=24, className=''}) => <i className={`ph-fill ph-warning-circle ${className}`} style={{fontSize: size}}></i>;
    const CheckCircle2 = ({size=24, className=''}) => <i className={`ph-fill ph-check-circle ${className}`} style={{fontSize: size}}></i>;
    const Clock = ({size=24, className=''}) => <i className={`ph-fill ph-clock ${className}`} style={{fontSize: size}}></i>;
    const Star = ({size=24, className='', onClick}) => {
      const isFilled = className.includes('fill-amber-400');
      return <i className={`${isFilled ? 'ph-fill' : 'ph'} ph-star ${className}`} style={{fontSize: size}} onClick={onClick}></i>;
    };
    const Save = ({size=24, className=''}) => <i className={`ph ph-floppy-disk ${className}`} style={{fontSize: size}}></i>;
    const KeyRound = ({size=24, className=''}) => <i className={`ph ph-key ${className}`} style={{fontSize: size}}></i>;
    const LogOut = ({size=24, className=''}) => <i className={`ph ph-sign-out ${className}`} style={{fontSize: size}}></i>;
    const ShieldCheck = ({size=24, className=''}) => <i className={`ph-fill ph-shield-check ${className}`} style={{fontSize: size}}></i>;
    const Eye = ({size=24, className=''}) => <i className={`ph ph-eye ${className}`} style={{fontSize: size}}></i>;
    const EyeOff = ({size=24, className=''}) => <i className={`ph ph-eye-slash ${className}`} style={{fontSize: size}}></i>;
    const Activity = ({size=24, className=''}) => <i className={`ph ph-activity ${className}`} style={{fontSize: size}}></i>;

    // 取得今天日期的字串 (YYYY-MM-DD)
    const getTodayStr = () => {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    };

    // --- 初始模擬資料 ---
    const initialData = {
      passwords: [
        { id: 'pwd_master', pwd: 'MasterPassword01!', role: 'master', label: '預設管理員' }
      ],
      plans: [
        { id: 'p1', name: '官網改版專案', color: '#3b82f6' }, 
        { id: 'p2', name: 'Q3 行銷活動', color: '#10b981' }  
      ],
      people: [
        { id: 'u1', name: 'Alice (設計)' },
        { id: 'u2', name: 'Bob (工程)' },
        { id: 'u3', name: 'Charlie (行銷)' }
      ],
      tasks: [
        { id: 't1', planId: 'p1', personId: 'u1', name: '首頁 UI 設計', startDate: '2026-03-20', endDate: '2026-03-25', progress: 100, importance: 5 }, 
        { id: 't2', planId: 'p1', personId: 'u2', name: '前端切版與串接', startDate: '2026-03-22', endDate: '2026-03-29', progress: 50, importance: 4 },  
        { id: 't3', planId: 'p2', personId: 'u3', name: '社群素材規劃', startDate: '2026-03-28', endDate: '2026-04-05', progress: 30, importance: 3 },  
        { id: 't4', planId: 'p2', personId: 'u1', name: '廣告圖設計', startDate: '2026-04-02', endDate: '2026-04-10', progress: 0, importance: 3 }    
      ]
    };

    // --- 核心共用邏輯：判定任務狀態與顏色 ---
    const analyzeTaskStatus = (task) => {
      const today = getTodayStr();
      if (task.progress === 100) {
        return { id: 'completed', label: '已完成', barColor: '#9ca3af', textColor: 'text-slate-500', badgeClass: 'bg-slate-100 text-slate-600', icon: <CheckCircle2 size={14}/> };
      }
      if (task.endDate < today && task.progress < 100) {
        return { id: 'delayed', label: '已延遲', barColor: '#ef4444', textColor: 'text-red-600', badgeClass: 'bg-red-100 text-red-700 font-bold border border-red-200', icon: <AlertCircle size={14}/> };
      }
      if (task.progress === 0 && task.startDate > today) {
        return { id: 'not_started', label: '未開始', barColor: null, textColor: 'text-slate-400', badgeClass: 'bg-slate-50 text-slate-500 border border-slate-200', icon: <Clock size={14}/> };
      }
      return { id: 'in_progress', label: '進行中', barColor: null, textColor: 'text-blue-600', badgeClass: 'bg-blue-50 text-blue-600 border border-blue-200', icon: <Clock size={14}/> };
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [data, setData] = useState(initialData);
      const [historyLog, setHistoryLog] = useState([]);
      
      const [dialog, setDialog] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null });
      const [currentUser, setCurrentUser] = useState(null);
      const [authModal, setAuthModal] = useState({ isOpen: false, message: '', requiredRole: null, onSuccess: null });
      const [pwdInput, setPwdInput] = useState('');
      const [authError, setAuthError] = useState('');

      // 雲端同步狀態
      const [cloudStatus, setCloudStatus] = useState(auth ? '☁️ 連線中...' : '☁️ 僅本地儲存');
      const [cloudUser, setCloudUser] = useState(null);
      const fileInputRef = useRef(null);

      // --- 1. 雲端資料庫：建立連線與認證 ---
      useEffect(() => {
        if (!auth) return;
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("雲端認證失敗:", e);
            setCloudStatus('⚠️ 雲端斷線');
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (u) => {
          setCloudUser(u);
          if (u) setCloudStatus('☁️ 雲端已連線');
        });
        return () => unsubscribe();
      }, []);

      // --- 2. 雲端資料庫：監聽遠端資料變化 (自動讀取) ---
      useEffect(() => {
        if (!cloudUser || !db) return;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taskmaster', 'shared');
        const unsubscribe = onSnapshot(docRef, (snapshot) => {
          if (snapshot.exists()) {
            const cloudData = snapshot.data();
            if (cloudData.data) setData(cloudData.data);
            if (cloudData.historyLog) setHistoryLog(cloudData.historyLog);
            setCloudStatus('☁️ 雲端已同步');
          }
        }, (error) => {
          console.error("讀取雲端資料發生錯誤:", error);
          setCloudStatus('⚠️ 同步失敗');
        });
        return () => unsubscribe();
      }, [cloudUser]);

      // --- 3. 雲端資料庫：儲存資料到雲端 (自動寫入) ---
      const saveToCloud = (newData, newLog) => {
        if (!cloudUser || !db) return;
        setCloudStatus('☁️ 同步中...');
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taskmaster', 'shared');
        setDoc(docRef, { data: newData, historyLog: newLog })
          .then(() => setCloudStatus('☁️ 雲端已同步'))
          .catch(e => {
            console.error("儲存至雲端失敗:", e);
            setCloudStatus('⚠️ 儲存失敗');
          });
      };

      const showAlert = (message) => setDialog({ isOpen: true, type: 'alert', message, onConfirm: null });
      const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, type: 'confirm', message, onConfirm });
      const closeDialog = () => setDialog({ ...dialog, isOpen: false });

      const executeSecureAction = (actionMessage, actionCallback, requiredRole = null) => {
        if (!currentUser || (requiredRole === 'master' && currentUser.role !== 'master')) {
          setPwdInput('');
          setAuthError('');
          setAuthModal({ isOpen: true, message: actionMessage, requiredRole, onSuccess: actionCallback });
        } else {
          actionCallback(currentUser);
        }
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const matchedUser = data.passwords.find(p => p.pwd === pwdInput);
        if (!matchedUser) return setAuthError('密碼錯誤，請重新輸入');
        if (authModal.requiredRole === 'master' && matchedUser.role !== 'master') return setAuthError('權限不足，此操作需要管理員 (MASTER) 密碼');

        setCurrentUser(matchedUser);
        setAuthModal({ isOpen: false, message: '', requiredRole: null, onSuccess: null });
        if (authModal.onSuccess) authModal.onSuccess(matchedUser);
      };

      // 所有的資料更動都會經過這個函式，並觸發雲端儲存
      const commitData = (newData, actionDescription, user) => {
        const timestamp = new Date().toLocaleString('zh-TW');
        const newLogEntry = { id: Date.now().toString(), timestamp, description: actionDescription, snapshot: JSON.parse(JSON.stringify(data)), user: user.label };
        const newLog = [newLogEntry, ...historyLog];
        setHistoryLog(newLog);
        setData(newData);
        saveToCloud(newData, newLog);
      };

      const rollback = (snapshot, logDescription) => {
        showConfirm(`確定要回溯到「${logDescription}」之前的狀態嗎？這將會覆蓋當前資料。`, () => {
          executeSecureAction(`執行回溯：${logDescription}`, (user) => {
            commitData(snapshot, `執行回溯：還原至 ${logDescription} 的狀態`, user);
          }, 'master');
        });
      };

      const setAsOrigin = (snapshot = null, description = '當前狀態') => {
        showConfirm(`確定要將「${description}」設為新的紀錄原點嗎？這將會永久刪除所有修改紀錄！`, () => {
          executeSecureAction(`設定歷史原點`, (user) => {
            const finalData = snapshot ? snapshot : data;
            if (snapshot) setData(snapshot);
            setHistoryLog([]);
            saveToCloud(finalData, []);
            showAlert(`已成功將「${description}」設為新原點。`);
          }, 'master');
        });
      };

      const exportData = () => {
        const exportObj = { data, historyLog };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `TaskMaster_Backup_${getTodayStr()}.json`);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
      };

      const handleImportClick = () => {
        showConfirm('【警告】匯入將會覆蓋當前所有資料與密碼設定！\n這項變更也會同步至雲端，強烈建議您先「匯出 JSON」備份當前狀態。\n\n確定要繼續匯入嗎？', () => {
          fileInputRef.current.click();
        });
      };

      const importData = (event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const imported = JSON.parse(e.target.result);
              if (imported.data) {
                setData(imported.data);
                const newLog = imported.historyLog || [];
                setHistoryLog(newLog);
                saveToCloud(imported.data, newLog); // 同步匯入的資料到雲端
                setCurrentUser(null); 
                showAlert('資料匯入成功，並已全數同步！');
              }
            } catch (err) { showAlert('解析檔案失敗，檔案格式可能錯誤。'); }
          };
          reader.readAsText(file);
        }
        event.target.value = '';
      };

      const handleClearAllData = () => {
        showConfirm('【極度危險】確定要清空系統內所有的計畫、人員、任務與歷史紀錄嗎？\n此動作將無法復原！（您的密碼設定將會保留以防無法登入）', () => {
          executeSecureAction(`清空所有系統資料`, (user) => {
            const clearedData = { ...data, plans: [], people: [], tasks: [] };
            setData(clearedData);
            setHistoryLog([]);
            saveToCloud(clearedData, []);
            showAlert('系統資料已全數清空。');
          }, 'master');
        });
      };

      return (
        <div className="flex flex-col h-screen bg-slate-50 text-slate-800 text-sm font-sans">
          {authModal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 z-[110] flex items-center justify-center backdrop-blur-sm">
              <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4 border border-slate-100">
                <div className="flex items-center gap-3 text-blue-600 mb-2">
                  <ShieldCheck size={28} />
                  <h3 className="text-xl font-bold">身分驗證</h3>
                </div>
                <p className="text-slate-600 mb-6 text-sm">{authModal.message}</p>
                <form onSubmit={handleAuthSubmit}>
                  <div className="mb-4">
                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">請輸入授權密碼</label>
                    <input type="password" value={pwdInput} onChange={e => setPwdInput(e.target.value)} className="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-base tracking-widest font-mono" placeholder="••••••••••••••••" autoFocus />
                    {authError && <div className="text-red-500 text-xs mt-2 font-medium flex items-center gap-1"><AlertCircle size={14}/> {authError}</div>}
                  </div>
                  <div className="flex justify-end gap-3 mt-6">
                    <button type="button" onClick={() => setAuthModal({...authModal, isOpen: false})} className="px-5 py-2.5 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 font-bold transition-colors">取消</button>
                    <button type="submit" className="px-5 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-bold transition-colors shadow-sm">確認解鎖</button>
                  </div>
                </form>
                <div className="mt-6 pt-4 border-t border-slate-100 text-[10px] text-slate-400 text-center">
                  (預設管理員密碼：<span className="font-mono bg-slate-100 px-1 py-0.5 rounded text-slate-500">MasterPassword01!</span>)
                </div>
              </div>
            </div>
          )}

          {dialog.isOpen && (
            <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center">
              <div className="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full mx-4">
                <p className="text-slate-800 mb-6 text-base whitespace-pre-wrap">{dialog.message}</p>
                <div className="flex justify-end gap-3">
                  {dialog.type === 'confirm' && (
                    <button onClick={closeDialog} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 font-medium">取消</button>
                  )}
                  <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); closeDialog(); }} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">確定</button>
                </div>
              </div>
            </div>
          )}

          <header className="bg-slate-900 text-slate-300 flex items-center justify-between px-6 py-3 shadow-md z-20 shrink-0">
            <div className="flex items-center gap-8">
              <div>
                <h1 className="text-xl font-bold text-white flex items-center gap-2">
                  <CheckSquare className="text-blue-400" size={24} />
                  TaskMaster
                </h1>
              </div>
              <nav className="flex items-center space-x-1">
                <NavItem icon={<LayoutDashboard />} label="儀表板" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                <NavItem icon={<FolderKanban />} label="計畫" active={activeTab === 'plans'} onClick={() => setActiveTab('plans')} />
                <NavItem icon={<Users />} label="人員" active={activeTab === 'people'} onClick={() => setActiveTab('people')} />
                <NavItem icon={<CheckSquare />} label="任務" active={activeTab === 'tasks'} onClick={() => setActiveTab('tasks')} />
                <NavItem icon={<History />} label="歷史回溯" active={activeTab === 'history'} onClick={() => setActiveTab('history')} />
                <NavItem icon={<KeyRound />} label="密碼管理" active={activeTab === 'passwords'} onClick={() => executeSecureAction('進入密碼管理中心需要驗證管理員權限', () => setActiveTab('passwords'), 'master')} />
              </nav>
            </div>
            <div className="flex items-center space-x-3">
              {/* 雲端儲存狀態提示 */}
              <div className="flex flex-col items-end mr-3 pr-4 border-r border-slate-700">
                <span className={`text-[10px] font-bold ${cloudStatus.includes('失敗') || cloudStatus.includes('僅本地') ? 'text-slate-400' : 'text-emerald-400'}`}>{cloudStatus}</span>
                <span className="text-xs text-slate-500 mt-0.5 leading-none">儲存狀態</span>
              </div>

              {currentUser && (
                <div className="flex items-center gap-2 mr-2 border-r border-slate-700 pr-4">
                  <div className="flex flex-col items-end">
                    <span className="text-[10px] text-slate-400 font-bold uppercase">{currentUser.role === 'master' ? '管理員 (Master)' : '一般使用者'}</span>
                    <span className="text-xs text-blue-300 font-medium">{currentUser.label}</span>
                  </div>
                  <button onClick={() => setCurrentUser(null)} className="p-1.5 bg-slate-800 hover:bg-red-500 hover:text-white rounded-md transition-colors text-slate-400" title="登出並鎖定"><LogOut size={16} /></button>
                </div>
              )}
              <button onClick={exportData} className="flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-md bg-slate-800 hover:bg-slate-700 transition-colors text-white"><Download size={14} /> 匯出 JSON</button>
              <button onClick={handleImportClick} className="flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-md bg-slate-800 hover:bg-slate-700 transition-colors text-white"><Upload size={14} /> 匯入</button>
              <input type="file" ref={fileInputRef} accept=".json" className="hidden" onChange={importData} />
            </div>
          </header>

          <main className="flex-1 overflow-auto p-6">
            {activeTab === 'dashboard' && <DashboardView data={data} />}
            {activeTab === 'plans' && <PlansView data={data} commitData={commitData} executeSecureAction={executeSecureAction} showConfirm={showConfirm} />}
            {activeTab === 'people' && <PeopleView data={data} commitData={commitData} executeSecureAction={executeSecureAction} showConfirm={showConfirm} />}
            {activeTab === 'tasks' && <TasksView data={data} commitData={commitData} executeSecureAction={executeSecureAction} showConfirm={showConfirm} />}
            {activeTab === 'history' && <HistoryView historyLog={historyLog} rollback={rollback} setAsOrigin={setAsOrigin} currentUser={currentUser} />}
            {activeTab === 'passwords' && <PasswordsView data={data} commitData={commitData} executeSecureAction={executeSecureAction} showConfirm={showConfirm} onClearAll={handleClearAllData} />}
          </main>
        </div>
      );
    }

    function NavItem({ icon, label, active, onClick }) {
      return (
        <button onClick={onClick} className={`flex items-center gap-2 px-3 py-2 rounded-lg transition-all ${active ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'}`}>
          {React.cloneElement(icon, { size: 16 })}
          <span className="font-medium text-sm whitespace-nowrap">{label}</span>
        </button>
      );
    }

    // --- 子組件 ---
    function DashboardView({ data }) {
      const tasksWithStatus = data.tasks.map(t => ({ ...t, state: analyzeTaskStatus(t) }));
      const completed = tasksWithStatus.filter(t => t.state.id === 'completed').length;
      const delayed = tasksWithStatus.filter(t => t.state.id === 'delayed').length;
      const inProgress = tasksWithStatus.filter(t => t.state.id === 'in_progress').length;
      const notStarted = tasksWithStatus.filter(t => t.state.id === 'not_started').length;
      const total = data.tasks.length;
      const avgProgress = total > 0 ? Math.round(data.tasks.reduce((acc, t) => acc + parseInt(t.progress || 0), 0) / total) : 0;

      return (
        <div className="space-y-6">
          <h2 className="text-2xl font-bold text-slate-800">專案數據儀表板 (KPI Dashboard)</h2>
          <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
            <StatCard title="總任務數" value={total} icon={<CheckSquare size={20} className="text-slate-500" />} />
            <StatCard title="平均總進度" value={`${avgProgress}%`} icon={<Activity size={20} className="text-amber-500" />} />
            <StatCard title="已完成" value={completed} icon={<CheckCircle2 size={20} className="text-emerald-500" />} />
            <StatCard title="進行中" value={inProgress} icon={<Clock size={20} className="text-blue-500" />} />
            <div className={`p-4 rounded-xl shadow-sm border flex items-center gap-3 ${delayed > 0 ? 'bg-red-50 border-red-200' : 'bg-white border-slate-100'}`}>
              <div className={`p-3 rounded-lg ${delayed > 0 ? 'bg-red-100 text-red-600' : 'bg-slate-50 text-slate-400'}`}><AlertCircle size={20} /></div>
              <div><div className={`text-xs font-medium ${delayed > 0 ? 'text-red-600' : 'text-slate-500'}`}>落後延遲任務</div><div className={`text-xl font-bold ${delayed > 0 ? 'text-red-700' : 'text-slate-800'}`}>{delayed}</div></div>
            </div>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 lg:col-span-1 flex flex-col">
              <h3 className="text-base font-bold mb-4">狀態分佈</h3>
              <div className="flex-1 flex flex-col justify-center space-y-4">
                <ProgressBar label="已完成" count={completed} total={total} color="bg-slate-400" />
                <ProgressBar label="進行中" count={inProgress} total={total} color="bg-blue-500" />
                <ProgressBar label="未開始" count={notStarted} total={total} color="bg-slate-200" />
                <ProgressBar label="已延遲" count={delayed} total={total} color="bg-red-500" />
              </div>
            </div>
            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 lg:col-span-2">
              <h3 className="text-base font-bold mb-3">需關注任務 (延遲或即將到期)</h3>
              <div className="space-y-2">
                {tasksWithStatus.filter(t => t.state.id === 'delayed' || t.state.id === 'in_progress').slice(0, 5).map(task => (
                  <div key={task.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100">
                    <div className="flex items-center gap-3">
                      <span className={`flex items-center gap-1 px-2 py-0.5 rounded text-xs ${task.state.badgeClass}`}>{task.state.icon} {task.state.label}</span>
                      <div><div className="font-medium text-sm">{task.name}</div><div className="text-[10px] text-slate-500">{task.startDate} ~ {task.endDate}</div></div>
                    </div>
                    <div className={`text-sm font-bold ${task.state.textColor}`}>{task.progress}%</div>
                  </div>
                ))}
                {tasksWithStatus.filter(t => t.state.id === 'delayed' || t.state.id === 'in_progress').length === 0 && <div className="text-center text-slate-400 py-6 text-sm">目前無待辦或延遲的任務</div>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function StatCard({ title, value, icon }) {
      return (
        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3">
          <div className="p-3 bg-slate-50 rounded-lg">{icon}</div>
          <div><div className="text-xs text-slate-500 font-medium">{title}</div><div className="text-xl font-bold text-slate-800">{value}</div></div>
        </div>
      );
    }

    function ProgressBar({ label, count, total, color }) {
      const percent = total > 0 ? Math.round((count / total) * 100) : 0;
      return (
        <div>
          <div className="flex justify-between text-xs mb-1"><span className="font-medium text-slate-600">{label} ({count})</span><span className="text-slate-400">{percent}%</span></div>
          <div className="w-full bg-slate-100 rounded-full h-2"><div className={`${color} h-2 rounded-full`} style={{ width: `${percent}%` }}></div></div>
        </div>
      );
    }

    function PlansView({ data, commitData, executeSecureAction, showConfirm }) {
      const [newPlan, setNewPlan] = useState({ name: '', color: '#3b82f6' });
      const handleAdd = (e) => {
        e.preventDefault();
        if (!newPlan.name) return;
        executeSecureAction(`新增計畫：${newPlan.name}`, (user) => {
          commitData({ ...data, plans: [...data.plans, { id: `p${Date.now()}`, ...newPlan }] }, `新增計畫：${newPlan.name}`, user);
          setNewPlan({ name: '', color: '#3b82f6' });
        });
      };
      const handleDelete = (id, name) => {
        showConfirm(`確定刪除計畫「${name}」？`, () => {
          executeSecureAction(`刪除計畫：${name}`, (user) => {
            commitData({ ...data, plans: data.plans.filter(p => p.id !== id) }, `刪除計畫：${name}`, user);
          });
        });
      };

      return (
        <div className="space-y-4">
          <h2 className="text-2xl font-bold text-slate-800">計畫管理</h2>
          <form onSubmit={handleAdd} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex gap-4 items-end">
            <div className="flex-1"><label className="block text-xs font-medium text-slate-700 mb-1">計畫名稱</label><input type="text" value={newPlan.name} onChange={e => setNewPlan({...newPlan, name: e.target.value})} className="w-full px-3 py-1.5 border border-slate-300 rounded-md outline-none" required /></div>
            <div><label className="block text-xs font-medium text-slate-700 mb-1">識別色</label><input type="color" value={newPlan.color} onChange={e => setNewPlan({...newPlan, color: e.target.value})} className="h-8 w-14 p-0.5 border border-slate-300 rounded-md cursor-pointer" /></div>
            <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-1.5 rounded-md font-medium flex items-center gap-2"><Plus size={16} /> 新增</button>
          </form>
          <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
            {data.plans.map(plan => (
              <div key={plan.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center group">
                <div className="flex items-center gap-3"><div className="w-3.5 h-3.5 rounded-full" style={{ backgroundColor: plan.color }}></div><span className="font-semibold">{plan.name}</span></div>
                <button onClick={() => handleDelete(plan.id, plan.name)} className="text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100"><Trash2 size={16} /></button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PeopleView({ data, commitData, executeSecureAction, showConfirm }) {
      const [newName, setNewName] = useState('');
      const handleAdd = (e) => {
        e.preventDefault();
        if (!newName) return;
        executeSecureAction(`新增人員：${newName}`, (user) => {
          commitData({ ...data, people: [...data.people, { id: `u${Date.now()}`, name: newName }] }, `新增人員：${newName}`, user);
          setNewName('');
        });
      };
      const handleDelete = (id, name) => {
        showConfirm(`確定移除人員「${name}」？`, () => {
          executeSecureAction(`移除人員：${name}`, (user) => {
            commitData({ ...data, people: data.people.filter(p => p.id !== id) }, `移除人員：${name}`, user);
          });
        });
      };

      return (
        <div className="space-y-4">
          <h2 className="text-2xl font-bold text-slate-800">人員管理</h2>
          <form onSubmit={handleAdd} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex gap-4 items-end max-w-2xl">
            <div className="flex-1"><label className="block text-xs font-medium text-slate-700 mb-1">人員名稱與職稱</label><input type="text" value={newName} onChange={e => setNewName(e.target.value)} className="w-full px-3 py-1.5 border border-slate-300 rounded-md outline-none" required /></div>
            <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-1.5 rounded-md font-medium flex items-center gap-2"><Plus size={16} /> 新增</button>
          </form>
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
            {data.people.map(person => (
              <div key={person.id} className="bg-white p-3 rounded-xl shadow-sm border flex justify-between items-center group">
                <span className="font-medium text-sm">{person.name}</span>
                <button onClick={() => handleDelete(person.id, person.name)} className="text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100"><Trash2 size={16} /></button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function TasksView({ data, commitData, executeSecureAction, showConfirm }) {
      const [newTask, setNewTask] = useState({ name: '', planId: '', personId: '', startDate: '', endDate: '', progress: 0, importance: 3 });
      const [filters, setFilters] = useState({ planId: '', personId: '', statusId: '' }); 
      const [sortConfig, setSortConfig] = useState(null); 

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newTask.name || !newTask.planId || !newTask.personId || !newTask.startDate || !newTask.endDate) return;
        executeSecureAction(`新增任務：${newTask.name}`, (user) => {
          const task = { id: `t${Date.now()}`, ...newTask, progress: parseInt(newTask.progress) };
          commitData({ ...data, tasks: [...data.tasks, task] }, `新增任務：${task.name}`, user);
          setNewTask({ name: '', planId: '', personId: '', startDate: '', endDate: '', progress: 0, importance: 3 });
        });
      };

      const handleUpdateProgress = (id, newProgress) => {
        executeSecureAction(`更新任務進度`, (user) => {
          const updatedTasks = data.tasks.map(t => t.id === id ? { ...t, progress: parseInt(newProgress) } : t);
          commitData({ ...data, tasks: updatedTasks }, `更新任務進度`, user);
        });
      };

      const handleUpdateImportance = (id, newImportance) => {
        executeSecureAction(`更新任務重要性`, (user) => {
          const updatedTasks = data.tasks.map(t => t.id === id ? { ...t, importance: newImportance } : t);
          commitData({ ...data, tasks: updatedTasks }, `更新任務重要性`, user);
        });
      };

      const handleDelete = (id, name) => {
        showConfirm(`確定刪除任務「${name}」？`, () => {
          executeSecureAction(`刪除任務：${name}`, (user) => {
            commitData({ ...data, tasks: data.tasks.filter(t => t.id !== id) }, `刪除任務：${name}`, user);
          });
        });
      };

      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig && sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
        setSortConfig({ key, direction });
      };
      const resetSort = () => setSortConfig(null);

      const filteredTasks = data.tasks.filter(t => {
        const statusInfo = analyzeTaskStatus(t);
        if (filters.planId && t.planId !== filters.planId) return false;
        if (filters.personId && t.personId !== filters.personId) return false;
        if (filters.statusId && statusInfo.id !== filters.statusId) return false;
        return true;
      });

      const sortedTasks = useMemo(() => {
        let sortableItems = [...filteredTasks];
        if (sortConfig !== null) {
          sortableItems.sort((a, b) => {
            let aValue, bValue;
            if (sortConfig.key === 'status') {
              const weight = { 'delayed': 4, 'in_progress': 3, 'not_started': 2, 'completed': 1 };
              aValue = weight[analyzeTaskStatus(a).id] || 0; bValue = weight[analyzeTaskStatus(b).id] || 0;
            } else if (sortConfig.key === 'person') {
              aValue = data.people.find(p => p.id === a.personId)?.name || ''; bValue = data.people.find(p => p.id === b.personId)?.name || '';
            } else if (sortConfig.key === 'importance') {
              aValue = a.importance || 1; bValue = b.importance || 1;
            } else if (sortConfig.key === 'progress') {
              aValue = a.progress || 0; bValue = b.progress || 0;
            }
            if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
            if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }
        return sortableItems;
      }, [filteredTasks, sortConfig, data.people]);

      const timeline = useMemo(() => {
        if (data.tasks.length === 0) return { days: [] };
        let minTime = Infinity; let maxTime = -Infinity;
        data.tasks.forEach(t => {
          const [sy, sm, sd] = t.startDate.split('-'); const [ey, em, ed] = t.endDate.split('-');
          const sTime = new Date(sy, sm-1, sd, 12, 0, 0).getTime(); const eTime = new Date(ey, em-1, ed, 12, 0, 0).getTime();
          if (sTime < minTime) minTime = sTime; if (eTime > maxTime) maxTime = eTime;
        });
        const todayTime = new Date().getTime();
        if (todayTime < minTime) minTime = todayTime;
        if (todayTime > maxTime) maxTime = todayTime;

        const minDate = new Date(minTime); const maxDate = new Date(maxTime);
        minDate.setDate(minDate.getDate() - 2); maxDate.setDate(maxDate.getDate() + 4);

        const days = [];
        let current = new Date(minDate);
        while (current <= maxDate) { days.push(new Date(current)); current.setDate(current.getDate() + 1); }
        return { days };
      }, [data.tasks]);

      const todayStr = getTodayStr();

      return (
        <div className="space-y-4 flex flex-col h-full">
          <div className="flex justify-between items-end">
            <h2 className="text-2xl font-bold text-slate-800">任務與排程管理</h2>
            <div className="flex items-center gap-2 bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm text-xs">
              <Filter size={14} className="text-slate-400 ml-1" />
              <span className="text-slate-500 font-medium mr-1">篩選:</span>
              <select value={filters.planId} onChange={e => setFilters({...filters, planId: e.target.value})} className="border-none bg-slate-50 rounded px-2 py-1 outline-none cursor-pointer">
                <option value="">所有計畫</option>
                {data.plans.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
              <select value={filters.personId} onChange={e => setFilters({...filters, personId: e.target.value})} className="border-none bg-slate-50 rounded px-2 py-1 outline-none cursor-pointer">
                <option value="">所有人員</option>
                {data.people.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
              <select value={filters.statusId} onChange={e => setFilters({...filters, statusId: e.target.value})} className="border-none bg-slate-50 rounded px-2 py-1 outline-none cursor-pointer">
                <option value="">所有狀態</option>
                <option value="in_progress">進行中</option>
                <option value="completed">已完成</option>
                <option value="delayed">已延遲</option>
                <option value="not_started">未開始</option>
              </select>
              {(filters.planId || filters.personId || filters.statusId) && (
                <button onClick={() => setFilters({planId:'', personId:'', statusId:''})} className="text-red-500 hover:text-red-700 px-2 font-medium">清除</button>
              )}
              {sortConfig && (
                <button onClick={resetSort} className="text-blue-500 hover:text-blue-700 px-2 font-medium border-l border-slate-200 ml-1">回復原始排序</button>
              )}
            </div>
          </div>
          
          <form onSubmit={handleAdd} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-3 shrink-0">
            <div className="flex flex-col md:flex-row gap-4">
              <div className="flex-1"><label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">任務名稱</label><input type="text" value={newTask.name} onChange={e => setNewTask({...newTask, name: e.target.value})} className="w-full px-3 py-1.5 border border-slate-300 rounded-md outline-none text-sm" required placeholder="輸入任務內容..." /></div>
              <div className="w-full md:w-56"><label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">所屬計畫</label><select value={newTask.planId} onChange={e => setNewTask({...newTask, planId: e.target.value})} className="w-full px-3 py-1.5 border border-slate-300 rounded-md outline-none text-sm" required><option value="">選擇...</option>{data.plans.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
              <div className="w-full md:w-56"><label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">負責人</label><select value={newTask.personId} onChange={e => setNewTask({...newTask, personId: e.target.value})} className="w-full px-3 py-1.5 border border-slate-300 rounded-md outline-none text-sm" required><option value="">選擇...</option>{data.people.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
            </div>
            <div className="flex flex-col md:flex-row gap-4 items-end">
              <div className="w-full md:w-auto">
                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">時程 (起 - 訖)</label>
                <div className="flex items-center gap-1.5">
                  <input type="date" value={newTask.startDate} onChange={e => setNewTask({...newTask, startDate: e.target.value})} className="w-40 px-2 py-1.5 border border-slate-300 rounded-md outline-none text-xs" required />
                  <span className="text-slate-400">-</span>
                  <input type="date" value={newTask.endDate} onChange={e => setNewTask({...newTask, endDate: e.target.value})} className="w-40 px-2 py-1.5 border border-slate-300 rounded-md outline-none text-xs" required />
                </div>
              </div>
              <div className="w-full md:w-48">
                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">重要性 (星級)</label>
                <div className="flex items-center gap-1.5 h-8">
                  {[1, 2, 3, 4, 5].map(star => (
                    <Star key={star} size={20} className={`cursor-pointer transition-colors ${newTask.importance >= star ? 'fill-amber-400 text-amber-400' : 'text-slate-200'}`} onClick={() => setNewTask({...newTask, importance: star})} />
                  ))}
                </div>
              </div>
              <div className="flex-1 flex justify-end">
                <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-1.5 rounded-md font-medium flex items-center justify-center gap-1.5 h-8 text-sm transition-colors"><Plus size={16} /> 新增任務</button>
              </div>
            </div>
          </form>

          <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto overflow-y-auto flex-1 relative">
            <div className="w-max min-w-full flex flex-col">
              <div className="flex border-b border-slate-200 bg-slate-100 text-[9px] text-slate-600 font-bold sticky top-0 z-30 shadow-sm">
                <div className="sticky left-0 bg-slate-100 z-40 flex shadow-[2px_0_5px_rgba(0,0,0,0.06)] shrink-0 h-8">
                  <div className="w-32 p-1.5 border-r border-slate-200 flex items-center">任務名稱</div>
                  <div className="w-16 p-1.5 border-r border-slate-200 flex items-center justify-center cursor-pointer hover:bg-slate-200 select-none" onClick={() => handleSort('status')}>狀態 <span className="text-blue-500 w-2 ml-0.5">{sortConfig?.key === 'status' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</span></div>
                  <div className="w-16 p-1.5 border-r border-slate-200 flex items-center cursor-pointer hover:bg-slate-200 select-none" onClick={() => handleSort('person')}>負責人 <span className="text-blue-500 w-2 ml-0.5">{sortConfig?.key === 'person' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</span></div>
                  <div className="w-16 p-1.5 border-r border-slate-200 flex items-center justify-center cursor-pointer hover:bg-slate-200 select-none" onClick={() => handleSort('importance')}>重要性 <span className="text-blue-500 w-2 ml-0.5">{sortConfig?.key === 'importance' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</span></div>
                  <div className="w-12 p-1.5 border-r border-slate-200 flex items-center justify-center cursor-pointer hover:bg-slate-200 select-none" onClick={() => handleSort('progress')}>進度 <span className="text-blue-500 w-2 ml-0.5">{sortConfig?.key === 'progress' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</span></div>
                  <div className="w-8 p-1.5 border-r border-slate-200 flex items-center justify-center">操作</div>
                </div>
                <div className="flex bg-slate-50">
                  {timeline.days.map((day, i) => {
                    const dayStr = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
                    const isToday = dayStr === todayStr;
                    return (
                      <div key={i} className={`w-8 py-0.5 border-r border-slate-200 flex flex-col items-center justify-center shrink-0 h-8 ${isToday ? 'bg-amber-100 border-amber-300' : ''}`} title={isToday ? '今天' : dayStr}>
                        <span className={`text-[8px] leading-none mb-0.5 ${isToday ? 'text-amber-700 font-bold' : 'text-slate-400'}`}>{day.getMonth()+1}月</span>
                        <span className={`text-[9px] leading-none ${isToday ? 'text-amber-700 font-bold' : ''}`}>{day.getDate()}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="flex flex-col divide-y divide-slate-100 pb-4">
                {sortedTasks.map(task => {
                  const plan = data.plans.find(p => p.id === task.planId) || {};
                  const person = data.people.find(p => p.id === task.personId) || {};
                  const statusInfo = analyzeTaskStatus(task);
                  const importance = task.importance || 1;
                  const finalBarColor = statusInfo.barColor || plan.color || '#94a3b8';

                  return (
                    <div key={task.id} className="flex hover:bg-slate-50 group items-stretch transition-colors">
                      <div className="sticky left-0 bg-white group-hover:bg-slate-50 z-20 flex shadow-[2px_0_5px_rgba(0,0,0,0.04)] shrink-0 transition-colors text-[9px]">
                        <div className="w-32 p-1.5 border-r border-slate-100 flex flex-col justify-center truncate">
                          <div className="font-medium text-[9px] truncate" title={task.name}>{task.name}</div>
                          <div className="text-[8px] text-slate-400 truncate mt-0.5 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full inline-block shrink-0" style={{backgroundColor: plan.color}}></span><span className="truncate">{plan.name || '已刪除計畫'}</span></div>
                        </div>
                        <div className="w-16 p-1.5 border-r border-slate-100 flex items-center justify-center"><span className={`flex items-center justify-center px-1 py-0.5 rounded text-[8px] w-full shadow-sm truncate ${statusInfo.badgeClass}`} title={statusInfo.label}><span className="truncate">{statusInfo.label}</span></span></div>
                        <div className="w-16 p-1.5 border-r border-slate-100 flex items-center text-[9px] truncate" title={person.name}>{person.name || '未知'}</div>
                        <div className="w-16 p-1.5 border-r border-slate-100 flex items-center justify-center gap-0.5">
                          {[1, 2, 3, 4, 5].map(star => <Star key={star} size={9} className={`cursor-pointer ${importance >= star ? 'fill-amber-400 text-amber-400' : 'text-slate-200'}`} onClick={() => handleUpdateImportance(task.id, star)} title={`設為 ${star} 星`} />)}
                        </div>
                        <div className="w-12 p-1.5 border-r border-slate-100 flex items-center justify-center gap-0.5 relative overflow-hidden group/progress">
                          <div className="absolute left-0 top-0 bottom-0 opacity-20 transition-all duration-300 pointer-events-none" style={{ width: `${task.progress}%`, backgroundColor: finalBarColor }} />
                          <input type="number" min="0" max="100" value={task.progress} onChange={(e) => handleUpdateProgress(task.id, e.target.value)} className={`w-6 text-right bg-transparent border-b border-transparent group-hover/progress:border-slate-300 focus:border-blue-500 outline-none font-bold ${statusInfo.textColor} cursor-pointer relative z-10 appearance-none`} title="點擊修改進度" />
                          <span className={`font-bold ${statusInfo.textColor} relative z-10`}>%</span>
                        </div>
                        <div className="w-8 p-1.5 border-r border-slate-100 flex items-center justify-center"><button onClick={() => handleDelete(task.id, task.name)} className="text-slate-400 hover:text-red-500 transition-colors" title="刪除任務"><Trash2 size={12} /></button></div>
                      </div>
                      
                      <div className="flex bg-transparent">
                        {timeline.days.map((day, i) => {
                          const dayStr = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
                          const isWithin = dayStr >= task.startDate && dayStr <= task.endDate;
                          const isStart = dayStr === task.startDate;
                          const isEnd = dayStr === task.endDate;
                          const isToday = dayStr === todayStr;

                          return (
                            <div key={i} className={`w-8 border-r border-slate-100 shrink-0 flex items-center justify-center h-8 ${isToday ? 'bg-amber-50/50' : ''} ${isStart ? 'pl-0.5' : ''} ${isEnd ? 'pr-0.5' : ''}`}>
                              {isWithin && <div className={`h-4 w-full ${isStart ? 'rounded-l-sm' : ''} ${isEnd ? 'rounded-r-sm' : ''} shadow-sm opacity-90`} style={{ backgroundColor: finalBarColor }} title={`${task.name} (${task.startDate} ~ ${task.endDate})`} />}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
                {sortedTasks.length === 0 && <div className="p-8 text-center text-slate-400 text-sm">找不到符合條件的任務</div>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function HistoryView({ historyLog, rollback, setAsOrigin, currentUser }) {
      if (historyLog.length === 0) return (
        <div className="space-y-4">
          <h2 className="text-2xl font-bold text-slate-800">修改紀錄</h2>
          <div className="bg-white p-10 rounded-xl shadow-sm border border-slate-100 text-center text-slate-500"><History size={40} className="mx-auto mb-4 opacity-20" /><p className="text-sm">目前尚無任何修改紀錄。</p></div>
        </div>
      );

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-3">
            <div><h2 className="text-2xl font-bold text-slate-800">修改紀錄與回溯</h2><p className="text-slate-500 text-sm mt-1">這裡紀錄了你所有的操作，可以選擇回溯，或將某個狀態設為新的起點。</p></div>
            <button onClick={() => setAsOrigin(null, '當前系統狀態')} className="flex items-center justify-center gap-1.5 text-xs px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition-colors font-bold border border-red-200 shrink-0 shadow-sm"><Save size={16} /> 將當前狀態設為原點</button>
          </div>

          <div className="relative border-l-2 border-slate-200 ml-3 space-y-6 py-4">
            {historyLog.map((log) => (
              <div key={log.id} className="relative pl-5">
                <div className="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full bg-blue-500 border-4 border-slate-50"></div>
                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:justify-between md:items-start gap-4">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <div className="text-xs text-slate-500">{log.timestamp}</div>
                      {currentUser?.role === 'master' && log.user && <span className="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-bold whitespace-nowrap">操作者: {log.user}</span>}
                    </div>
                    <div className="font-medium text-slate-800 text-base">{log.description}</div>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    <button onClick={() => setAsOrigin(log.snapshot, log.description)} className="flex items-center gap-1.5 text-xs px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 rounded-md transition-colors font-bold"><Save size={14} /> 儲存為原點</button>
                    <button onClick={() => rollback(log.snapshot, log.description)} className="flex items-center gap-1.5 text-xs px-3 py-1.5 bg-slate-100 hover:bg-amber-100 hover:text-amber-700 text-slate-600 rounded-md transition-colors font-bold"><Undo2 size={14} /> 回溯至此狀態</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PasswordsView({ data, commitData, executeSecureAction, showConfirm, onClearAll }) {
      const [newPwd, setNewPwd] = useState({ label: '', role: 'user', pwd: '' });
      const [showPwds, setShowPwds] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleAdd = (e) => {
        e.preventDefault();
        setErrorMsg('');
        if (newPwd.pwd.length < 16 || newPwd.pwd.length > 32) return setErrorMsg('密碼長度必須介於 16 到 32 個字元之間');
        if (data.passwords.some(p => p.pwd === newPwd.pwd)) return setErrorMsg('密碼與現有密碼重複，請更改');

        executeSecureAction(`新增授權密碼：${newPwd.label}`, (user) => {
          const pwdEntry = { id: `pwd_${Date.now()}`, ...newPwd };
          commitData({ ...data, passwords: [...data.passwords, pwdEntry] }, `新增密碼：${newPwd.label}`, user);
          setNewPwd({ label: '', role: 'user', pwd: '' });
        }, 'master');
      };

      const handleDelete = (id, label, role) => {
        if (role === 'master' && data.passwords.filter(p => p.role === 'master').length <= 1) {
          alert('無法刪除最後一組管理員 (MASTER) 密碼，這將導致系統無法管理！');
          return;
        }
        showConfirm(`確定要刪除授權密碼「${label}」嗎？`, () => {
          executeSecureAction(`刪除授權密碼：${label}`, (user) => {
            commitData({ ...data, passwords: data.passwords.filter(p => p.id !== id) }, `刪除密碼：${label}`, user);
          }, 'master');
        });
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4">
            <div><h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><KeyRound className="text-blue-500" />密碼與權限管理</h2><p className="text-slate-500 text-sm mt-1">此區僅限管理員 (MASTER) 存取。在此可新增、撤銷系統授權密碼。</p></div>
            <button onClick={onClearAll} className="flex items-center justify-center gap-1.5 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold shadow-sm transition-colors shrink-0"><Trash2 size={16} /> 清空所有系統內容</button>
          </div>

          <form onSubmit={handleAdd} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row gap-4 items-start md:items-end">
            <div className="w-full md:w-1/4"><label className="block text-xs font-medium text-slate-700 mb-1">使用者或群組名稱</label><input type="text" value={newPwd.label} onChange={e => setNewPwd({...newPwd, label: e.target.value})} className="w-full px-3 py-1.5 border border-slate-300 rounded-md outline-none" required placeholder="例如：開發組A、行銷主管..." /></div>
            <div className="w-full md:w-1/4"><label className="block text-xs font-medium text-slate-700 mb-1">權限等級</label><select value={newPwd.role} onChange={e => setNewPwd({...newPwd, role: e.target.value})} className="w-full px-3 py-1.5 border border-slate-300 rounded-md outline-none" required><option value="user">一般使用者 (USER) - 可編修資料</option><option value="master">管理員 (MASTER) - 擁有一切權限與稽核日誌</option></select></div>
            <div className="flex-1 w-full">
              <label className="block text-xs font-medium text-slate-700 mb-1">設定密碼 (16 ~ 32 碼)</label>
              <div className="relative">
                <input type={showPwds ? "text" : "password"} value={newPwd.pwd} onChange={e => setNewPwd({...newPwd, pwd: e.target.value})} className={`w-full px-3 py-1.5 pr-8 border ${errorMsg ? 'border-red-400' : 'border-slate-300'} rounded-md outline-none font-mono tracking-widest`} required placeholder="大小寫英文、數字、符號皆可" />
                <button type="button" onClick={() => setShowPwds(!showPwds)} className="absolute right-2 top-2 text-slate-400 hover:text-slate-600">{showPwds ? <EyeOff size={14}/> : <Eye size={14}/>}</button>
              </div>
              {errorMsg && <div className="text-red-500 text-[10px] mt-1 font-bold">{errorMsg}</div>}
            </div>
            <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-1.5 rounded-md font-medium flex items-center gap-2 h-[34px] w-full md:w-auto justify-center"><Plus size={16} /> 新增授權</button>
          </form>

          <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-50 text-slate-600 text-xs border-b border-slate-100"><th className="p-4 font-medium">身分標籤</th><th className="p-4 font-medium">權限</th><th className="p-4 font-medium">密碼 <button onClick={() => setShowPwds(!showPwds)} className="ml-2 text-blue-500 hover:underline">{showPwds ? '隱藏' : '顯示'}</button></th><th className="p-4 font-medium text-center w-20">操作</th></tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {data.passwords.map(p => (
                  <tr key={p.id} className="hover:bg-slate-50 transition-colors group text-sm">
                    <td className="p-4 font-medium">{p.label}</td>
                    <td className="p-4"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${p.role === 'master' ? 'bg-indigo-100 text-indigo-700 border border-indigo-200' : 'bg-slate-100 text-slate-600 border border-slate-200'}`}>{p.role === 'master' ? 'MASTER' : 'USER'}</span></td>
                    <td className="p-4 font-mono text-slate-500 tracking-widest text-xs">{showPwds ? p.pwd : '•'.repeat(16)}</td>
                    <td className="p-4 text-center"><button onClick={() => handleDelete(p.id, p.label, p.role)} className="text-slate-400 hover:text-red-500 transition-colors" title="撤銷密碼"><Trash2 size={16} /></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
